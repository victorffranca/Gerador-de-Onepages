<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnePage Generator</title>
<meta name="theme-color" content="#efe7d2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2315140f'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Arial' font-weight='900' font-size='20' fill='%23f7f1de'%3E4%3C/text%3E%3Ccircle cx='26' cy='24' r='2.5' fill='%23ed6f5c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@1,500;1,600;1,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Design system "Open Design" (pasta designsystem/): papel pergaminho com textura, títulos em Inter Tight
   com itálicos em Playfair Display, coral como destaque, cartões "bone" e botões em pílula.
   A one page do cliente segue o padrão V4 próprio (REPORT_CSS em report.js). */
:root {
  --ink: #15140f;
  --ink-soft: #2a2620;
  --paper: #efe7d2;
  --paper-warm: #ece4cf;
  --paper-dark: #ddd2b6;
  --bone: #f7f1de;
  --accent: #ed6f5c;
  --accent-dark: #e25e4a;
  --accent-tint: #f6d8cc;
  --accent2: #6e7448;
  --accent2-tint: #e2dfc4;
  --mustard: #e9b94a;
  --mustard-tint: #f2e1b0;
  --text: #2a2620;
  --muted: #5a5448;
  --muted2: #8b8676;
  --placeholder: #a9a392;
  --border: rgba(21, 20, 15, .16);
  --border2: rgba(21, 20, 15, .24);
  --line: rgba(21, 20, 15, .08);
  --white: #f7f1de;
  --field: #fbf8ee;
  --success: #4f7a37;
  --warn: #a8740f;
  --danger: #c2412d;
  --surface: #f7f1de;
  --surface2: #ece4cf;
  --shadow: 0 30px 60px -30px rgba(21, 20, 15, .18), inset 0 0 0 1px rgba(21, 20, 15, .06);
  --serif: "Playfair Display", "Times New Roman", serif;
  --sans: "Inter Tight", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", Menlo, monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--body); background:var(--paper); color:var(--text); min-height:100vh; font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased; }
/* textura de papel do design system (fica por cima, sem capturar cliques) */
body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:1; mix-blend-mode:multiply; opacity:.92;
  background-image:radial-gradient(circle at 12% 18%, rgba(106,92,56,.07) 0, transparent 28%), radial-gradient(circle at 88% 72%, rgba(106,92,56,.06) 0, transparent 32%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.16  0 0 0 0 0.12  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  background-size:auto, auto, 240px 240px; }
button { font-family:inherit; }
.boot { min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; font-family:var(--mono); letter-spacing:.04em; }

/* ── MARCA ── */
.brand { display:inline-flex; align-items:center; gap:10px; cursor:pointer; white-space:nowrap; }
.brand-mark { width:32px; height:32px; border-radius:9px; background:var(--ink); color:var(--bone); font-family:var(--sans); font-weight:900; font-size:18px; line-height:32px; text-align:center; flex-shrink:0; }
.brand-name { font-family:var(--sans); font-size:18px; font-weight:700; letter-spacing:-.02em; color:var(--ink); }
.brand-sub { font-family:var(--serif); font-style:italic; font-size:16px; font-weight:500; color:var(--muted); margin-left:-4px; }

/* ── TOPBAR ── */
.topbar { background:var(--paper); padding:0 40px; height:66px; display:flex; align-items:center; gap:36px; position:sticky; top:0; z-index:50; border-bottom:1px solid var(--border); }
.topnav { display:flex; gap:6px; flex:1; align-self:stretch; }
.nav-link { background:none; border:none; color:var(--ink-soft); font-size:14px; font-weight:500; padding:0 12px; cursor:pointer; position:relative; }
.nav-link:hover { color:var(--accent); }
.nav-link.active { color:var(--accent); }
.nav-link.active::after { content:""; position:absolute; left:12px; right:12px; bottom:14px; height:1px; background:var(--accent); }
.nav-link .count { display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:999px; background:var(--accent); color:var(--bone); font-size:10px; line-height:18px; text-align:center; font-family:var(--mono); }
.topbar-user { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; min-width:0; }
.topbar-user img, .avatar { width:30px; height:30px; border-radius:50%; object-fit:cover; flex-shrink:0; }
.avatar { background:var(--ink); color:var(--bone); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; font-family:var(--sans); }
.topbar-user .who { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px; font-family:var(--mono); font-size:11.5px; }
.role-badge { font-family:var(--sans); font-size:10px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; padding:4px 10px; border-radius:999px; background:var(--ink); color:var(--bone); }
.role-badge.admin { background:var(--accent2); }
.btn-ghost-dark { background:transparent; border:1px solid var(--border2); color:var(--ink); border-radius:999px; padding:6px 14px; font-size:12px; font-weight:500; cursor:pointer; font-family:var(--sans); }
.btn-ghost-dark:hover { background:rgba(21,20,15,.05); }
.saving { font-family:var(--mono); font-size:11px; color:var(--muted); display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
.saving[hidden] { display:none; }
.saving::before { content:""; width:11px; height:11px; border-radius:50%; border:1px dashed var(--border2); border-top:2px solid var(--accent); animation:spin .9s linear infinite; }
.demo-banner { background:var(--paper-dark); border-bottom:1px solid var(--border); color:var(--ink-soft); font-family:var(--sans); font-size:11px; letter-spacing:.06em; padding:8px 40px; text-align:center; position:relative; z-index:2; }
.demo-banner code { font-family:var(--mono); background:var(--paper); padding:1px 5px; border-radius:4px; }

/* ── MAIN ── */
.main { padding:44px 40px 90px; max-width:1180px; margin:0 auto; width:100%; position:relative; }
.main.narrow { max-width:880px; }
.page-header { margin-bottom:34px; display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap; }
.page-header .eyebrow { font-family:var(--sans); font-size:10.5px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin-bottom:14px; display:flex; align-items:center; gap:12px; }
.page-header .eyebrow::before { content:""; width:24px; height:1px; background:var(--accent); flex-shrink:0; }
.page-header h1 { font-family:var(--sans); font-size:clamp(34px, 4.2vw, 50px); font-weight:800; letter-spacing:-.035em; line-height:1; color:var(--ink); }
.page-header h1 em { font-family:var(--serif); font-style:italic; font-weight:600; letter-spacing:-.01em; color:var(--ink); }
.page-header h1::after { content:"."; color:var(--accent); }
.header-actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.link-back { background:none; border:none; color:var(--muted); font-family:var(--sans); font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; cursor:pointer; margin-bottom:18px; padding:0; }
.link-back:hover { color:var(--accent); }
.section-title { font-family:var(--sans); font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.18em; color:var(--muted2); margin:36px 0 16px; padding-top:14px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px; }
.section-title .dot, .form-section-title .dot { width:6px; height:6px; border-radius:50%; background:var(--accent); }

/* ── BUTTONS ── */
.btn-primary { background:var(--accent); color:#fff; border:1px solid transparent; border-radius:999px; padding:12px 22px; font-family:var(--sans); font-weight:500; font-size:14px; letter-spacing:-.005em; cursor:pointer; box-shadow:0 14px 26px -16px var(--accent); transition:transform .18s ease, background .18s ease; white-space:nowrap; }
.btn-primary:hover { background:var(--accent-dark); transform:translateY(-1px); }
.btn-primary:disabled { opacity:.6; cursor:default; transform:none; }
.btn-secondary { background:transparent; color:var(--ink); border:1px solid var(--border2); border-radius:999px; padding:11px 20px; font-family:var(--sans); font-size:14px; font-weight:500; cursor:pointer; transition:background .18s ease; white-space:nowrap; }
.btn-secondary:hover { background:rgba(21,20,15,.05); }
.btn-danger { background:transparent; color:var(--danger); border:1px solid rgba(194,65,45,.4); border-radius:999px; padding:11px 20px; font-family:var(--sans); font-size:14px; font-weight:500; cursor:pointer; }
.btn-danger:hover { background:var(--accent-tint); }
.btn-sm { padding:6px 14px; font-size:12.5px; }
.btn-add { background:none; border:1px dashed var(--border2); border-radius:14px; padding:12px 20px; font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:.06em; color:var(--muted); cursor:pointer; width:100%; margin-top:4px; transition:all .12s; }
.btn-add:hover { border-color:var(--accent); color:var(--accent); }
.btn-smart { background:transparent; color:var(--ink); border:1px solid var(--border2); border-radius:999px; padding:6px 14px; font-family:var(--sans); font-size:12px; font-weight:500; cursor:pointer; white-space:nowrap; }
.btn-smart:hover { background:var(--ink); color:var(--bone); }
.icon-btn { background:none; border:1px solid transparent; border-radius:999px; width:30px; height:30px; cursor:pointer; color:var(--muted2); font-size:14px; display:inline-flex; align-items:center; justify-content:center; }
.icon-btn:hover { border-color:var(--border2); color:var(--ink); background:var(--field); }

/* ── LOGIN ── */
.login-wrap { min-height:100vh; display:grid; grid-template-columns:1.1fr 1fr; position:relative; z-index:2; }
.login-side { background:var(--ink); color:var(--bone); padding:56px; display:flex; flex-direction:column; justify-content:space-between; border-radius:0 22px 22px 0; }
.login-side .brand-mark { background:var(--bone); color:var(--ink); }
.login-side .brand-name { color:var(--bone); }
.login-side .brand-sub { color:rgba(247,241,222,.6); }
.login-side h2 { font-family:var(--sans); font-size:52px; font-weight:800; letter-spacing:-.035em; line-height:1; max-width:460px; }
.login-side h2 em { font-family:var(--serif); font-style:italic; font-weight:600; color:var(--bone); letter-spacing:-.01em; }
.login-side p { color:rgba(247,241,222,.7); margin-top:22px; max-width:420px; font-size:15px; }
.login-feats { display:flex; flex-direction:column; gap:10px; color:rgba(247,241,222,.82); font-family:var(--sans); font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
.login-main { display:flex; align-items:center; justify-content:center; padding:40px 24px; }
.login-card { width:100%; max-width:380px; }
.login-card h1 { font-family:var(--sans); font-size:40px; font-weight:800; letter-spacing:-.035em; color:var(--ink); margin-bottom:8px; }
.login-card h1::after { content:"."; color:var(--accent); }
.login-card .sub { color:var(--muted); font-size:14px; margin-bottom:28px; }
.btn-google { width:100%; display:flex; align-items:center; justify-content:center; gap:10px; background:var(--bone); border:1px solid var(--border2); border-radius:999px; padding:13px; font-family:var(--sans); font-size:14px; font-weight:500; cursor:pointer; color:var(--ink); box-shadow:var(--shadow); transition:transform .18s ease; }
.btn-google:hover { transform:translateY(-1px); }
.login-note { margin-top:18px; font-size:12px; color:var(--muted2); line-height:1.6; }
.demo-box { margin-top:20px; padding:16px; border:1px dashed var(--border2); background:var(--paper-warm); border-radius:14px; font-size:12px; color:var(--ink-soft); }
.demo-box .form-group { margin-top:10px; }
.state-card { max-width:480px; margin:12vh auto; background:var(--bone); border-radius:22px; box-shadow:var(--shadow); padding:40px; text-align:center; position:relative; z-index:2; }
.state-card .big { font-size:36px; margin-bottom:10px; }
.state-card h1 { font-family:var(--sans); font-size:26px; font-weight:800; color:var(--ink); margin-bottom:10px; letter-spacing:-.03em; }
.state-card p { color:var(--muted); font-size:13.5px; margin-bottom:24px; }

/* ── TOOLBAR / CLIENTS ── */
.toolbar { display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap; }
.toolbar .search { flex:1; min-width:200px; }
.input, .form-group input, .form-group select, .form-group textarea {
  border:1px solid var(--border); border-radius:12px; padding:10px 14px; font-family:var(--body); font-size:13.5px;
  background:var(--field); color:var(--ink); outline:none; width:100%; line-height:1.4; transition:border-color .12s, box-shadow .12s;
}
.toolbar .input { border-radius:999px; padding:11px 18px; }
select.input { width:auto; }
.input:focus, .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(237,111,92,.18); }
.input::placeholder, .form-group input::placeholder, .form-group textarea::placeholder { color:var(--placeholder); }
.client-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; }
.client-card { background:var(--bone); border-radius:18px; box-shadow:var(--shadow); padding:22px 22px 18px; cursor:pointer; transition:transform .2s ease; display:flex; flex-direction:column; gap:4px; min-height:170px; }
.client-card:hover { transform:translateY(-3px); }
.cc-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.type-pill { font-family:var(--sans); font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:.16em; padding:4px 10px; border-radius:999px; background:var(--accent-tint); color:var(--accent-dark); }
.type-pill.is { background:var(--accent2-tint); color:var(--accent2); }
.cc-name { font-family:var(--sans); font-size:22px; font-weight:700; letter-spacing:-.02em; line-height:1.1; color:var(--ink); }
.cc-meta { font-size:12.5px; color:var(--muted); }
.cc-foot { margin-top:auto; padding-top:14px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); display:flex; justify-content:space-between; gap:8px; font-family:var(--mono); }
.cc-foot strong { color:var(--ink); font-weight:500; }
.cc-owner { font-size:11px; color:var(--muted2); margin-top:4px; font-family:var(--mono); }
.empty { background:transparent; border:1px dashed var(--border2); border-radius:22px; padding:52px 24px; text-align:center; color:var(--muted); }
.empty .big { font-size:30px; margin-bottom:10px; }
.empty h3 { font-family:var(--sans); color:var(--ink); font-size:20px; font-weight:700; letter-spacing:-.02em; margin-bottom:6px; }
.empty p { font-size:13.5px; margin-bottom:18px; }

/* ── WINDSOR ── */
.windsor-box { margin-top:22px; padding-top:18px; border-top:1px solid var(--border); }
.windsor-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.windsor-msg { font-size:12.5px; color:var(--muted); background:var(--paper-warm); border-radius:12px; padding:12px 14px; }
.link-btn { background:none; border:none; color:var(--accent); font-family:var(--sans); font-size:12px; font-weight:600; cursor:pointer; padding:0; }
.link-btn:hover { text-decoration:underline; }
.form-group input.pulled, .form-group select.pulled { background:#fdebd9; border-color:rgba(237,111,92,.5); }
.w-picker { display:flex; flex-direction:column; gap:12px; }
.w-results { display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto; }
.w-hint { font-size:12px; color:var(--muted2); padding:4px 2px; }
.w-row { display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:var(--field); border:1px solid var(--border); border-radius:12px; padding:9px 12px; cursor:pointer; font-size:13px; color:var(--text); }
.w-row:hover { border-color:var(--accent); background:#fdf1ea; }
.w-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; color:var(--ink); }
.w-id { font-size:11px; color:var(--muted2); white-space:nowrap; font-family:var(--mono); }
.w-plat { font-family:var(--sans); font-size:9.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; padding:3px 9px; border-radius:999px; white-space:nowrap; flex-shrink:0; }
.w-plat.meta { background:rgba(21,20,15,.09); color:var(--ink); }
.w-plat.google { background:var(--mustard-tint); color:#7a5508; }
.w-plat.ga4 { background:var(--accent-tint); color:var(--accent-dark); }
.w-plat.geral { background:var(--line); color:var(--muted); }
.w-slots { display:flex; flex-direction:column; border:1px solid var(--border); border-radius:14px; overflow:hidden; }
.w-slot { display:flex; align-items:center; gap:10px; padding:10px 12px; font-size:13px; border-bottom:1px solid var(--line); background:var(--paper-warm); }
.w-slot:last-child { border-bottom:none; }
.w-slot.on { background:var(--field); }
.w-slot .w-plat { min-width:92px; text-align:center; }
.w-val { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); font-weight:600; }
.w-val small { color:var(--muted2); font-weight:400; margin-left:6px; font-family:var(--mono); font-size:11px; }
.w-val em { color:var(--muted2); font-weight:400; font-family:var(--serif); font-style:italic; }

/* ── RELATÓRIO COM IA ── */
.btn-ai { background:var(--ink); color:var(--bone); box-shadow:0 14px 26px -16px var(--ink); }
.btn-ai:hover { background:#000; }
.ai-steps { margin:18px 0 16px 20px; font-size:13.5px; color:var(--text); display:flex; flex-direction:column; gap:8px; }
.ai-steps li::marker { font-family:var(--serif); font-style:italic; color:var(--accent); }
.ai-progress { display:flex; flex-direction:column; align-items:center; gap:12px; padding:32px 0; text-align:center; font-family:var(--sans); font-weight:600; color:var(--ink); }
.ai-progress small { font-family:var(--body); font-weight:400; color:var(--muted2); }
.ai-spinner { width:38px; height:38px; border-radius:50%; border:1px dashed var(--border2); border-top:2px solid var(--accent); animation:spin .9s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.source-tag { font-family:var(--mono); font-size:10.5px; color:var(--accent2); background:var(--accent2-tint); padding:4px 10px; border-radius:999px; }

/* ── ABAS DO RELATÓRIO / MELHORIAS ── */
.report-tabs { display:flex; gap:6px; padding:0 40px; background:var(--paper); border-bottom:1px solid var(--border); position:relative; z-index:2; }
.rtab { background:none; border:none; border-bottom:1px solid transparent; padding:14px 12px; font-family:var(--sans); font-size:13.5px; font-weight:500; color:var(--muted); cursor:pointer; margin-bottom:-1px; }
.rtab:hover { color:var(--accent); }
.rtab.active { color:var(--accent); border-bottom-color:var(--accent); }
.rtab .count { display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:999px; background:var(--accent); color:var(--bone); font-size:10px; line-height:18px; text-align:center; font-family:var(--mono); }
.camp-meta { font-family:var(--mono); font-size:11px; color:var(--muted); }
.imp-list { margin-bottom:8px; }
.imp { display:flex; gap:16px; padding:18px 22px; border-bottom:1px solid var(--line); cursor:pointer; align-items:flex-start; }
.imp:last-child { border-bottom:none; }
.imp:hover { background:rgba(21,20,15,.03); }
.imp input { margin-top:4px; width:16px; height:16px; accent-color:var(--accent); flex-shrink:0; }
.imp-body { flex:1; min-width:0; }
.imp-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
.imp-camp { font-family:var(--mono); font-size:11px; color:var(--muted); }
.imp-acao { font-family:var(--sans); font-size:16px; font-weight:700; letter-spacing:-.01em; color:var(--ink); }
.imp-motivo { font-size:13px; color:var(--muted); margin-top:3px; }
.imp.done .imp-acao, .imp.done .imp-motivo { text-decoration:line-through; color:var(--muted2); }
.prio { font-family:var(--sans); font-size:9.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; padding:3px 9px; border-radius:999px; }
.prio.alta { background:var(--accent); color:#fff; }
.prio.media { background:var(--mustard-tint); color:#7a5508; }
.prio.baixa { background:var(--line); color:var(--muted); }
.camp-table td.r, .camp-table th.r { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
.camp-table td small { display:block; color:var(--muted2); font-size:10.5px; font-family:var(--mono); }
.camp-table .d { font-family:var(--mono); font-size:10.5px; font-weight:500; margin-left:4px; }
.camp-table .d.good { color:var(--success); }
.camp-table .d.bad { color:var(--danger); }
@media (max-width:760px) { .report-tabs { padding:0 8px; overflow-x:auto; } .rtab { white-space:nowrap; } }

/* ── ACESSOS ── */
.grant-row { display:grid; grid-template-columns:2fr 1fr auto; gap:12px; align-items:end; }
.role-help { margin-top:12px; font-size:12.5px; color:var(--muted); }
.input-sm { padding:6px 10px; font-size:12px; }

/* ── TABLE / CARD ── */
.card { background:var(--bone); border-radius:18px; box-shadow:var(--shadow); overflow:hidden; position:relative; }
.table { width:100%; border-collapse:collapse; }
.table th { font-family:var(--sans); font-size:10px; text-transform:uppercase; letter-spacing:.18em; color:var(--muted2); padding:16px 16px 12px; text-align:left; border-bottom:1px solid var(--border); font-weight:600; background:transparent; white-space:nowrap; }
.table td { padding:14px 16px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
.table tr:last-child td { border-bottom:none; }
.table tr.clickable { cursor:pointer; }
.table tr.clickable:hover td { background:rgba(21,20,15,.03); }
.table .actions-cell { text-align:right; white-space:nowrap; }
.table .muted { color:var(--muted2); font-size:12px; }
.person { display:flex; align-items:center; gap:10px; }
.person .avatar { background:var(--paper-dark); color:var(--ink); }
.person small { display:block; color:var(--muted2); font-size:11px; font-family:var(--mono); }
.status { font-family:var(--sans); font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; padding:3px 10px; border-radius:999px; }
.status.on { background:var(--accent2-tint); color:var(--accent2); }
.status.off { background:var(--accent-tint); color:var(--danger); }
.pct-chip { font-family:var(--mono); font-size:11px; font-weight:500; padding:3px 9px; border-radius:999px; background:var(--line); color:var(--muted); }
.pct-chip.ok { background:var(--accent2-tint); color:var(--success); }
.pct-chip.mid { background:var(--mustard-tint); color:var(--warn); }
.pct-chip.low { background:var(--accent-tint); color:var(--danger); }
.table-scroll { overflow-x:auto; }

/* ── EVOLUÇÃO ── */
.evo { background:var(--bone); border-radius:18px; box-shadow:var(--shadow); padding:22px 24px 14px; margin-bottom:8px; }
.evo-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
.evo-title { font-family:var(--sans); font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.18em; color:var(--muted2); }
.evo-bars { display:flex; align-items:flex-end; gap:10px; height:124px; }
.evo-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:0; }
.evo-bar { width:100%; max-width:46px; background:#f2b9ab; border-radius:8px 8px 2px 2px; min-height:2px; position:relative; }
.evo-col:last-child .evo-bar { background:var(--accent); }
.evo-bar.is { background:#cfcca8; }
.evo-col:last-child .evo-bar.is { background:var(--accent2); }
.evo-val { font-family:var(--mono); font-size:10px; color:var(--ink); margin-bottom:5px; white-space:nowrap; }
.evo-lbl { font-family:var(--sans); font-size:10px; color:var(--muted2); margin-top:7px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; }
.notes { background:var(--paper-warm); border-left:2px solid var(--accent); border-radius:0 14px 14px 0; padding:14px 18px; font-family:var(--serif); font-style:italic; font-size:15px; color:var(--ink-soft); white-space:pre-wrap; }

/* ── EDITOR ── */
.type-selector { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:30px; }
.type-btn { border:1px solid var(--border); background:var(--bone); border-radius:18px; padding:20px 22px; cursor:pointer; transition:transform .2s ease; text-align:left; position:relative; box-shadow:var(--shadow); }
.type-btn:hover { transform:translateY(-2px); }
.type-btn.active { border-color:var(--accent); box-shadow:var(--shadow), 0 0 0 1px var(--accent); }
.type-btn .tb-icon { font-size:22px; margin-bottom:10px; display:block; }
.type-btn .tb-name { font-family:var(--sans); font-size:18px; font-weight:700; color:var(--ink); display:block; margin-bottom:4px; letter-spacing:-.015em; }
.type-btn .tb-desc { font-size:12.5px; color:var(--muted); line-height:1.45; }
.type-btn .tb-check { position:absolute; top:16px; right:16px; width:20px; height:20px; border-radius:50%; border:1px dashed var(--border2); display:flex; align-items:center; justify-content:center; }
.type-btn.active .tb-check { background:var(--accent); border:1px solid var(--accent); }
.type-btn.active .tb-check::after { content:''; width:6px; height:6px; background:var(--bone); border-radius:50%; }
.form-section { margin-bottom:24px; background:var(--bone); border-radius:18px; box-shadow:var(--shadow); overflow:hidden; }
.form-section-header { padding:18px 22px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; background:transparent; flex-wrap:wrap; }
.form-section-title { font-family:var(--sans); font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.18em; color:var(--muted); display:flex; align-items:center; gap:8px; }
.form-section-title .opt { font-family:var(--serif); font-style:italic; font-weight:500; color:var(--muted2); font-size:13px; text-transform:none; letter-spacing:0; }
.form-section-hint { font-size:11.5px; color:var(--muted2); }
.form-section-body { padding:22px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-grid.cols-3 { grid-template-columns:1fr 1fr 1fr; }
.form-grid.cr { grid-template-columns:2fr 1fr 1fr; margin-bottom:12px; }
.form-grid + .form-grid { margin-top:16px; }
.form-group { display:flex; flex-direction:column; gap:6px; min-width:0; }
.form-group label { font-family:var(--sans); font-size:10px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.16em; }
.form-group label .opt { font-family:var(--serif); font-style:italic; color:var(--muted2); font-weight:500; text-transform:none; letter-spacing:0; font-size:12px; }
.form-group textarea { resize:vertical; min-height:76px; }
.form-group input[readonly] { background:var(--paper-warm); color:var(--muted); }
.form-group.full { grid-column:1 / -1; }
.auto-badge { font-family:var(--mono); font-size:9.5px; font-weight:500; background:var(--accent2-tint); color:var(--accent2); padding:2px 8px; border-radius:999px; letter-spacing:.02em; text-transform:none; }
.toggle-row { display:flex; align-items:center; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.toggle-tip { font-family:var(--sans); font-size:10.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-right:4px; }
.toggle-chip { font-family:var(--sans); font-size:12px; font-weight:500; padding:5px 12px; border-radius:999px; border:1px solid var(--border2); cursor:pointer; background:transparent; color:var(--muted); user-select:none; }
.toggle-chip.active { background:var(--accent2-tint); border-color:var(--accent2); color:var(--accent2); }
.toggle-chip.inactive { background:transparent; border-style:dashed; color:var(--muted2); text-decoration:line-through; }
.form-group.off { opacity:.4; }
.criativo-row, .insight-row { background:var(--paper-warm); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
.criativo-row-title { font-family:var(--sans); font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.16em; color:var(--muted); margin-bottom:12px; }
.insight-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.insight-type-selector { display:flex; gap:8px; }
.ins-type-btn { padding:5px 12px; border-radius:999px; border:1px solid var(--border2); font-family:var(--sans); font-size:12px; font-weight:500; cursor:pointer; background:transparent; color:var(--muted); }
.insight-row[data-tipo="pos"] .ins-type-btn[data-t="pos"] { background:var(--accent2-tint); border-color:var(--accent2); color:var(--accent2); }
.insight-row[data-tipo="opp"] .ins-type-btn[data-t="opp"] { background:var(--mustard-tint); border-color:var(--mustard); color:#7a5508; }
.insight-row.new { animation:flash 1.2s ease-out; }
@keyframes flash { from { box-shadow:0 0 0 3px rgba(237,111,92,.4); } to { box-shadow:0 0 0 0 rgba(237,111,92,0); } }
.checks { border:1px dashed var(--mustard); background:var(--mustard-tint); border-radius:14px; padding:16px 20px; margin-bottom:24px; font-size:12.5px; color:#6b4a07; }
.checks strong { display:block; margin-bottom:4px; font-family:var(--sans); font-size:12.5px; }
.checks ul { padding-left:18px; }
.checks.ok { border-color:var(--accent2); background:var(--accent2-tint); color:#4b4f2f; }
.editor-actions { display:flex; gap:10px; margin-top:30px; flex-wrap:wrap; position:sticky; bottom:0; z-index:3; background:linear-gradient(transparent, var(--paper) 32%); padding:22px 0 18px; }
.editor-actions .spacer { flex:1; }

/* ── REPORT VIEW ── */
.back-bar { display:flex; align-items:center; gap:10px; padding:12px 40px; background:var(--paper); border-bottom:1px solid var(--border); position:sticky; top:66px; z-index:40; flex-wrap:wrap; }
.back-bar .spacer { flex:1; }
.btn-back { background:transparent; border:1px solid var(--border2); border-radius:999px; padding:8px 16px; font-family:var(--sans); font-size:12.5px; font-weight:500; cursor:pointer; color:var(--ink); }
.btn-back:hover { background:rgba(21,20,15,.05); }
.btn-print { background:var(--ink); color:var(--bone); border:none; border-radius:999px; padding:9px 18px; font-family:var(--sans); font-weight:500; font-size:12.5px; cursor:pointer; }
.btn-dl { background:var(--accent); color:#fff; border:none; border-radius:999px; padding:9px 18px; font-family:var(--sans); font-weight:500; font-size:12.5px; cursor:pointer; box-shadow:0 14px 26px -16px var(--accent); }
/* a one page mantém o próprio visual; no app ela fica sobre o papel */
@media screen { .report-wrap { background:transparent; position:relative; z-index:2; } .report-wrap .op-page { box-shadow:var(--shadow); border-radius:10px; } }

/* ── MODAL / TOAST ── */
.modal-bg { position:fixed; inset:0; background:rgba(21,20,15,.42); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); display:flex; align-items:flex-start; justify-content:center; padding:7vh 16px 16px; z-index:100; overflow-y:auto; }
.modal { background:var(--bone); border-radius:22px; width:100%; max-width:580px; box-shadow:0 40px 80px -30px rgba(21,20,15,.45); }
.modal-head { padding:26px 28px 0; }
.modal-head h2 { font-family:var(--sans); font-size:28px; font-weight:800; letter-spacing:-.03em; color:var(--ink); }
.modal-head p { font-family:var(--serif); font-style:italic; font-size:15px; color:var(--muted); margin-top:2px; }
.modal-body { padding:22px 28px; }
.modal-actions { padding:16px 28px 22px; border-top:1px solid var(--line); display:flex; gap:10px; }
.modal-actions .spacer { flex:1; }
#toasts { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:200; align-items:center; pointer-events:none; }
.toast { background:var(--ink); color:var(--bone); padding:11px 20px; border-radius:999px; font-size:13px; font-weight:500; box-shadow:0 18px 36px -18px rgba(21,20,15,.6); animation:pop .2s ease-out; max-width:90vw; }
.toast.err { background:var(--danger); color:#fff; }
@keyframes pop { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

/* ── RESPONSIVO ── */
@media (max-width:760px) {
  .topbar { padding:0 12px; gap:8px; height:58px; }
  .back-bar { top:58px; padding:10px 16px; }
  .brand-name { font-size:15px; }
  .brand-mark { width:28px; height:28px; line-height:28px; font-size:16px; }
  .brand-sub, .topbar-user .who, .topbar-user .role-badge, .topbar-user .avatar { display:none; }
  .topnav { gap:0; min-width:0; }
  .nav-link { padding:0 8px; white-space:nowrap; font-size:13px; }
  .nav-link.active::after { left:8px; right:8px; }
  .main { padding:28px 16px 80px; }
  .demo-banner { padding:8px 16px; }
  .form-grid, .form-grid.cols-3, .form-grid.cr, .type-selector, .grant-row { grid-template-columns:1fr; }
  .login-wrap { grid-template-columns:1fr; }
  .login-side { padding:32px 24px; gap:28px; border-radius:0 0 22px 22px; }
  .login-side h2 { font-size:34px; }
  .table .hide-sm { display:none; }
}

@media print {
  .no-print, .topbar, .demo-banner, #toasts { display:none !important; }
  body { background:#fff; }
  body::before { display:none; }
}

</style>
