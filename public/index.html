<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnePage Generator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0a'/%3E%3Crect x='8' y='8' width='16' height='4' rx='1' fill='%23e84b1f'/%3E%3Crect x='8' y='15' width='16' height='2' rx='1' fill='%23fff'/%3E%3Crect x='8' y='20' width='10' height='2' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="root"><div class="boot">Carregando…</div></div>
<div id="modal"></div>
<div id="toasts"></div>
<script>
// Mostra na tela qualquer erro que impeça o app de iniciar.
window.addEventListener('error', function (e) {
  var boot = document.querySelector('#root .boot');
  if (boot) boot.textContent = 'Erro ao iniciar: ' + (e.message || e) + ' (' + (e.filename || '').split('/').pop() + ' linha ' + (e.lineno || '?') + ')';
});
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
