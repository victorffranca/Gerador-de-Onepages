<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnePage Generator</title>
<meta name="theme-color" content="#efe7d2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2315140f'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Arial' font-weight='900' font-size='20' fill='%23f7f1de'%3E4%3C/text%3E%3Ccircle cx='26' cy='24' r='2.5' fill='%23ed6f5c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@1,500;1,600;1,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="root"><div class="boot">Carregando…</div></div>
<div id="modal"></div>
<div id="toasts"></div>
<script>
// Mostra na tela qualquer erro que impeça o app de iniciar.
window.addEventListener('error', function (e) {
  var boot = document.querySelector('#root .boot');
  if (boot) boot.textContent = 'Erro ao iniciar: ' + (e.message || e) + ' (' + (e.filename || '').split('/').pop() + ' linha ' + (e.lineno || '?') + ')';
});
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
