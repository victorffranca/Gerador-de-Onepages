<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnePage Generator</title>
<meta name="theme-color" content="#efe7d2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315140f'/%3E%3Cg transform='translate(4 4) scale(.75)' fill='none' stroke='%23f7f1de'%3E%3Cpath d='M13 3.5H5.5a2 2 0 0 0-2 2v21a2 2 0 0 0 2 2h21a2 2 0 0 0 2-2V19' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M22.5 26V6.5L9 20.5h19' stroke-width='3.4' stroke-linecap='square'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="root"><div class="boot">Carregando…</div></div>
<div id="modal"></div>
<div id="toasts"></div>
<script>
// Mostra na tela qualquer erro que impeça o app de iniciar.
window.addEventListener('error', function (e) {
  var boot = document.querySelector('#root .boot');
  if (boot) boot.textContent = 'Erro ao iniciar: ' + (e.message || e) + ' (' + (e.filename || '').split('/').pop() + ' linha ' + (e.lineno || '?') + ')';
});
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
